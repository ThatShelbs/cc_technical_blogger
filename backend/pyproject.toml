[project]
name = "proseferno"
version = "0.1.0"
description = "Write engaging technical blog posts in your own voice."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Shelby Temple", email = "Shelby.Mustang.Temple@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.17.0",
    "fastapi>=0.156.4",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "markdown-it-py>=4.2.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "resvg-py>=0.5.0",
    "sqlmodel>=0.0.48",
    "sse-starlette>=3.5.0",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
    "vl-convert-python>=1.9.0.post1",
]

[project.scripts]
proseferno = "proseferno:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real Claude / Cloudflare APIs (costs money; opt-in with -m live)"]
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning:trafilatura.*"]

[tool.ruff]
line-length = 140
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/proseferno/images/render.py" = ["E501"]  # inline SVG template

[tool.mypy]
python_version = "3.13"
packages = ["proseferno"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]
